# .github/workflows/deploy-wiki.yml
name: deploy-wiki
on:
  workflow_dispatch:
  push:
    branches: "main"
    paths: # trigger filters cannot use env - keep in step with WIKI_PATH
      - wiki/**
      - .github/badge*
env:
  WIKI_PATH: wiki
jobs:
  deploy-wiki:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Expand badges and shorthands # written by Claude & wunditta
        run: python3 .github/badges.py "$WIKI_PATH"
      - uses: actions4gh/configure-wiki@v1
        with:
          path: ${{ env.WIKI_PATH }}
      - uses: actions4gh/deploy-wiki@v1
